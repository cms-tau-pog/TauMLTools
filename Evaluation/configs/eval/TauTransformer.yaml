# basic imports
defaults:
  - discriminator: TauTransformer
  - selection
  - _self_

# mflow run info
path_to_mlflow: /work/tvoigtlaender/thesis/ml/mlruns
experiment_name: TauT_TV_Thesis
run_name:
  - 2025_mar_ensemble_2_r_2
  - 2025_mar_ensemble_2_r_3
  - 2025_mar_ensemble_2_r_4
  - 2025_mar_ensemble_2_r_5
  - 2025_mar_ensemble_2_r_6
  - 2025_mar_ensemble_2_r_7
  - 2025_mar_ensemble_2_r_8
  - 2025_mar_ensemble_2_r_9
  - 2025_mar_ensemble_2_o_1
  - 2025_mar_ensemble_2_o_2
  - 2025_mar_ensemble_2_o_3
  - 2025_mar_scaling_6_1
  - 2025_mar_scaling_6_2
  - 2025_mar_scaling_6_3
  - 2025_mar_scaling_6_4
  - 2025_mar_scaling_6_5
  - 2025_mar_scaling_6_6
  - 2025_mar_scaling_6_7
  - 2025_mar_scaling_6_8
  - 2025_mar_scaling_6b_1
  - 2025_apr_full_dataset_1_1
  # - 2025_apr_full_dataset_cut_rand_2_1
  # - 2025_apr_full_dataset_cut_rand_2_2
  # - 2025_apr_full_dataset_cut_rand_2_3
  # - 2025_apr_full_dataset_cut_rand_2_4
  # - 2025_apr_full_dataset_cut_rand_2_5
  # - 2025_mar_rcut_2_1
  - 2025_apr_full_dataset_1_1_at7
  - 2025_apr_full_dataset_1_1_at21
  - 2025_apr_full_dataset_1_1_at47

# phase space region
vs_types:
  - jet
  - e
  - mu
dataset_alias: # alias to reference a mixture of input_samples below, e.g. tau_DY_jet_TT
  - tau_ggH_jet_TT
  - tau_ggH_e_DY
  - tau_ggH_mu_DY
pt_bins: [[20, 100]]
eta_bins: [[0, 2.3]]
dm_bins: [[0, 1, 10, 11]]

# selection
input_branches: [ 'tau_pt', 'tau_eta', 'tau_decayMode' , 'tau_dz'] # add here WP branches if necessary
cuts: "(${apply_dm_cuts}) and (abs(tau_dz) < 0.2)"
WPs_to_require: null # null to not apply WP as selection
# WPs_to_require: ### example for vs. jet
#   e: VVVLoose
#   mu: VLoose

# inputs/paths
input_samples: # "sample_alias": [list of strings with tau types to be selected]
  GluGluHToTauTau_M125: ['tau']
  DYJetsToLL_M-50-amcatnloFXFX_ext2: ["e", "mu"]
  TTToSemiLeptonic: ["jet"]
path_to_input: null
# path_to_pred: '${path_to_mlflow}/{experiment_id}/{run_id}/artifacts/predictions/{sample_alias}/*/predictions.h5'
path_to_target: null
path_to_weights_taus: null
path_to_weights_vs_type: null
output_file: performance_merge.json

# misc.
roc_prune_decimal: # precision on TPR rounding
  e: 5
  mu: 5
  jet: 5
